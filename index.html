<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Chapel Vietnam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Public HQ view. Aggregates only: no contract ids, no per-contract money. White, ink-only; colour only for shortfalls (red) and gains (blue).
   Left menu + right screen; the menu width is adjustable (drag the divider). Tables only — no charts. */
:root{
  --bg:#ffffff; --surface:#ffffff; --sunk:#f6f7f8; --ink:#16181b; --ink-2:#555b63; --ink-3:#868c94;
  --rule:#e4e6e9; --rule-2:#cfd3d8; --accent:#1f5fa8; --accent-soft:#e3ecf7; --neg:#b42318; --plan:#6b7078;
  --font:"Calibri","Carlito","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --nav-w:200px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.5}
.num{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:var(--nav-w) 6px minmax(0,1fr);min-height:100vh}
nav{border-right:1px solid var(--rule);padding:20px 10px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface)}
nav .brand{font-weight:700;font-size:16px;padding:0 8px 2px}
nav .sub{font-size:12px;color:var(--ink-3);padding:0 8px 16px;border-bottom:1px solid var(--rule);margin-bottom:10px}
nav button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;color:var(--ink-2);background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer;margin:1px 0}
nav button:hover{background:var(--sunk)}
nav button[aria-current="page"]{background:var(--ink);color:var(--bg);font-weight:700}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.gutter{cursor:col-resize;background:transparent;position:relative}
.gutter::after{content:"";position:absolute;top:0;bottom:0;left:2px;width:2px;background:transparent}
.gutter:hover::after,.gutter.drag::after{background:var(--rule-2)}
main{padding:24px clamp(16px,3vw,36px) 56px;min-width:0}
.page{max-width:1280px;display:grid;gap:28px}
header{display:grid;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px}
h1{font-size:22px;font-weight:700;margin:0}
h2{font-size:16px;font-weight:700;margin:0}
.meta{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.controls{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl>span{font-size:12px;color:var(--ink-3);letter-spacing:.04em}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule-2);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink-2);border:0;border-left:1px solid var(--rule-2);padding:5px 11px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:grid;gap:10px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:6px}
.sec-head p{margin:0;color:var(--ink-3);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--rule);display:grid;gap:4px;min-width:0}
.kpi:first-child{border-left:0}
.kpi .lbl{font-size:12.5px;color:var(--ink-2)}
.kpi .val{font-size:26px;font-weight:700;line-height:1.15}
.kpi .val small{font-size:13.5px;font-weight:400;color:var(--ink-2);margin-left:3px}
.kpi .vs{font-size:12.5px;color:var(--ink-2)}
.kpi .ytd{font-size:12.5px;color:var(--ink-3);border-top:1px dashed var(--rule);padding-top:5px}
.neg{color:var(--neg)} .pos{color:var(--accent)}
.stack{display:grid;gap:14px}
.page>*,section>*,.stack>*{min-width:0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
th{font-weight:700;color:var(--ink-2);background:var(--sunk);font-size:12.5px}
td:first-child,th:first-child{text-align:left}
th.grp{text-align:center;border-left:1px solid var(--rule-2)}
td.l,th.l{border-left:1px solid var(--rule-2)}
tr.block td{font-weight:700;background:var(--sunk)}
tr.sub td:first-child{padding-left:22px;color:var(--ink-2)}
tr.sub2 td:first-child{padding-left:38px;color:var(--ink-2)}
tr.tot td{font-weight:700;background:#fbfbfc}
tr.hq td{color:var(--ink-3)}
td.dash{color:var(--ink-3);text-align:center}
td.ref,th.ref{color:var(--ink-3)}
td.lbl2{color:var(--ink-3);font-size:12.5px}
tbody tr:last-child td{border-bottom:0}
tr.grp-first td{border-top:1px solid var(--rule-2)}
tbody tr.grp-first:first-child td{border-top:0}
.note{color:var(--ink-3);font-size:12.5px;margin:0}
.board-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:8px}
.board{display:grid;grid-template-columns:112px repeat(6,minmax(56px,1fr));min-width:520px;font-size:13px}
.board>div{padding:6px 8px;border-bottom:1px solid var(--rule)}
.board .hd{background:var(--sunk);color:var(--ink-2);font-weight:700;text-align:center}
.board .hd.first{text-align:left}
.board .hall{grid-column:span 3;border-left:1px solid var(--rule-2)}
.board .day{color:var(--ink-2);white-space:nowrap}
.board .day small{color:var(--ink-3);margin-left:4px}
.cell{display:flex;justify-content:center;align-items:center}
.cell.l{border-left:1px solid var(--rule-2)}
.slot{display:inline-block;width:100%;max-width:48px;height:20px;border-radius:4px;border:1px dashed var(--rule-2)}
.slot.planned{border:1.5px solid var(--plan)}
.slot.actual{background:var(--accent);border:0}
.slot.actual.unplanned{box-shadow:inset 0 0 0 2px var(--surface),0 0 0 1.5px var(--accent)}
.slot.booked{background:var(--accent-soft);border:1.5px solid var(--accent)}
.slot.na{border:0}
.board-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);align-items:center}
.board-legend .slot{width:28px;height:14px;vertical-align:middle;margin-right:6px}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2)}
footer{color:var(--ink-3);font-size:12px;display:grid;gap:3px;border-top:1px solid var(--rule);padding-top:12px}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule);padding:12px 12px 8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  nav .brand,nav .sub{display:none}
  nav button{width:auto;padding:6px 10px;font-size:13px}
  .gutter{display:none}
  .kpi{border-left:0;border-top:1px solid var(--rule)} .kpi:first-child{border-top:0}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* boot(SNAP) draws the page from one aggregate snapshot. Apps Script inlines it below; the GitHub Pages copy
   (tools/build-pages.js) fetches it from the web app's JSON endpoint instead. */
function boot(SNAP) {
  var app = document.getElementById('app');
  if (!SNAP) {
    app.innerHTML = '<div class="empty"><h1>The Chapel Vietnam</h1><p>이 링크는 올바르지 않거나 만료되었습니다. 최신 링크를 담당자에게 요청해 주세요.</p></div>';
    return;
  }
  // ---------- helpers ----------
  var HALLS = [['ALL', '전체'], ['LABELLE', 'La Belle'], ['LECLAIR', 'Le Clair']];
  var hallName = function (h) { return HALLS.filter(function (x) { return x[0] === h; })[0][1]; };
  var cut = SNAP.cutoff, cutY = cut.slice(0, 4), YEAR = 'YTD-' + cutY;
  var isYear = function (m) { return m.slice(0, 4) === 'YTD-'; };
  var mLabel = function (m) { return isYear(m) ? m.slice(6) + '년 누계' : +m.slice(5) + '월'; };
  var isPartial = function (m) { return m === cut.slice(0, 7); };
  var A = function (per, h) { return (SNAP.agg[per] || {})[h] || { a: {}, p: null }; };
  var O = function (per, cate) { var x = SNAP.other && SNAP.other[per] && SNAP.other[per][cate]; return x || null; };
  var vs = function (a, p) { return (a === null || a === undefined || !p) ? null : a / p - 1; };
  var pp = function (a, p) { return (a === null || a === undefined || p === null || p === undefined) ? null : (a - p) * 100; };
  var fmt = {
    mil: function (v) { return v === null || v === undefined || isNaN(v) ? '-' : (v / 1e6).toLocaleString('ko-KR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); },
    int: function (v) { return v === null || v === undefined || isNaN(v) ? '-' : Math.round(v).toLocaleString('ko-KR'); },
    won: function (v) { return v === null || v === undefined || isNaN(v) ? '-' : Math.round(v).toLocaleString('ko-KR'); },
    pct: function (v) { return v === null || v === undefined || isNaN(v) ? '-' : (v >= 0 ? '+' : '−') + Math.abs(v * 100).toFixed(1) + '%'; },
    pp: function (v) { return v === null || v === undefined || isNaN(v) ? '-' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + '%p'; },
    rate: function (v) { return v === null || v === undefined || isNaN(v) ? '-' : (v * 100).toFixed(1) + '%'; },
    diff: function (v, f) { return v === null || v === undefined || isNaN(v) ? '-' : (v > 0 ? '+' : v < 0 ? '−' : '') + f(Math.abs(v)); }
  };
  var cls = function (v) { return v === null || v === undefined || isNaN(v) || v === 0 ? '' : (v < 0 ? 'neg' : 'pos'); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var monthsAll = SNAP.months;                                            // 5월 ~ 기준월
  var mm = function (ym) { return +ym.slice(5) + '월'; };
  var div = function (a, b) { return b ? a / b : null; };

  // ---------- state ----------
  var VIEWS = [
    ['summary', '요약', ['period', 'hall']],
    ['sales', '매출현황', ['period']],
    ['annual', '연간계약', []],
    ['contracts', '계약 현황', []],
    ['booking', '예약 확보 분석', ['year', 'hall']],
    ['slots', '슬롯 예약현황', ['slotmonth', 'hall']],
    ['guests', '객수·객단가', ['period', 'hall']]
  ];
  var state = { view: 'summary', month: monthsAll[monthsAll.length - 1], hall: 'ALL', year: +cutY, slotmonth: cut.slice(0, 7) };
  try {
    var sv = JSON.parse(localStorage.getItem('hq-view2') || '{}');
    if (monthsAll.indexOf(sv.month) >= 0 || (sv.month && sv.month === YEAR)) state.month = sv.month;
    if (['ALL', 'LABELLE', 'LECLAIR'].indexOf(sv.hall) >= 0) state.hall = sv.hall;
    if (sv.navW) document.documentElement.style.setProperty('--nav-w', sv.navW + 'px');
  } catch (e) {}
  var h0 = (location.hash || '').replace('#', ''); if (VIEWS.some(function (v) { return v[0] === h0; })) state.view = h0;
  function save() { try { var o = JSON.parse(localStorage.getItem('hq-view2') || '{}'); o.month = state.month; o.hall = state.hall; localStorage.setItem('hq-view2', JSON.stringify(o)); } catch (e) {} }

  app.innerHTML = '<div class="shell"><nav id="nav" aria-label="메뉴"><div class="brand">The Chapel Vietnam</div><div class="sub">실적 · 데이터 기준 ' + cut + '</div></nav>' +
    '<div class="gutter" id="gutter" role="separator" aria-orientation="vertical" aria-label="메뉴 폭 조절" tabindex="0"></div>' +
    '<main><div class="page"><header><div><h1 id="title"></h1><div class="meta">베트남 · 공급가(VAT 제외) · 원화 · 데이터 기준 ' + cut + ' 24:00(전일자) · 마지막 갱신 ' + SNAP.asOf + ' (매일 01:00)</div></div>' +
    '<div class="controls" id="controls"></div></header><div id="view" class="page"></div>' +
    '<footer><div>환산: 원천 VND(부가세 포함) ÷ (1 + VAT율) × 환율 — 2026년 VAT 8%, 100 VND = 5.47원. 2027년 예식은 VAT 10%, 환율 임시 5.47원(2026년 환율) — 2027년 1월 초 2026년 연평균 확정치로 자동 보정.</div>' +
    '<div>계획: 본사 26년 사업계획(웨딩 슬롯별 472슬롯, 뷔페·B2B 일자별). 하객 = 성인 + 아동 ÷ 2. 뷔페·B2B = 이바지 TotalRevenue. 정의는 본사 실적 지표 정의서(r3 + r4)를 따릅니다.</div></footer></div></main></div>';

  // menu
  var nav = document.getElementById('nav');
  VIEWS.forEach(function (v) {
    var b = document.createElement('button'); b.type = 'button'; b.textContent = v[1]; b.id = 'nav-' + v[0];
    b.onclick = function () { state.view = v[0]; try { history.replaceState(null, '', '#' + v[0]); } catch (e) { location.hash = v[0]; } render(); };
    nav.appendChild(b);
  });
  // adjustable menu width (drag or arrow keys)
  (function () {
    var g = document.getElementById('gutter'), root = document.documentElement, dragging = false;
    var setW = function (w) { w = Math.max(120, Math.min(Math.round(window.innerWidth * 0.4), w)); root.style.setProperty('--nav-w', w + 'px'); try { var o = JSON.parse(localStorage.getItem('hq-view2') || '{}'); o.navW = w; localStorage.setItem('hq-view2', JSON.stringify(o)); } catch (e) {} };
    g.addEventListener('pointerdown', function (e) { dragging = true; g.classList.add('drag'); g.setPointerCapture(e.pointerId); });
    g.addEventListener('pointermove', function (e) { if (dragging) setW(e.clientX); });
    g.addEventListener('pointerup', function () { dragging = false; g.classList.remove('drag'); });
    g.addEventListener('keydown', function (e) { var w = nav.getBoundingClientRect().width; if (e.key === 'ArrowLeft') setW(w - 16); if (e.key === 'ArrowRight') setW(w + 16); });
  })();

  function seg(el, items, key) {
    var box = document.createElement('div'); box.className = 'seg'; box.setAttribute('role', 'group');
    items.forEach(function (it) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = it[1];
      b.setAttribute('aria-pressed', String(state[key]) === String(it[0]));
      b.onclick = function () { state[key] = it[0]; save(); render(); };
      box.appendChild(b);
    });
    el.appendChild(box);
  }
  function controls(list) {
    var c = document.getElementById('controls'); c.innerHTML = '';
    var add = function (label, items, key) { var d = document.createElement('div'); d.className = 'ctl'; d.innerHTML = '<span>' + label + '</span>'; seg(d, items, key); c.appendChild(d); };
    if (list.indexOf('period') >= 0) add('기간', monthsAll.map(function (m) { return [m, mLabel(m) + (isPartial(m) ? '*' : '')]; }).concat([[YEAR, mLabel(YEAR)]]), 'month');
    if (list.indexOf('year') >= 0 && SNAP.bk) add('예식 연도', SNAP.bk.years.map(function (y) { return [y, y + '년']; }), 'year');
    if (list.indexOf('slotmonth') >= 0) add('예식월', (SNAP.boardMonths || monthsAll).map(function (m) { return [m, mm(m)]; }), 'slotmonth');
    if (list.indexOf('hall') >= 0) add('홀', HALLS, 'hall');
  }
  var scopeText = function (m) { return isYear(m) ? m.slice(6) + '년 누계(1/1~' + cut.slice(5).replace('-', '/') + ')' : mLabel(m) + (isPartial(m) ? ' (1일~' + +cut.slice(8) + '일)' : ''); };
  var table = function (head, body) { return '<div class="tbl-wrap"><table>' + head + '<tbody>' + body + '</tbody></table></div>'; };
  var secHead = function (t, p) { return '<div class="sec-head"><h2>' + t + '</h2>' + (p ? '<p>' + p + '</p>' : '') + '</div>'; };
  // wedding / buffet / B2B / total for a period → { rev:{a,p}, … }
  var stream = function (per, h) {
    var w = A(per, h || 'ALL'), b = O(per, 'BUFFET'), x = O(per, 'B2B');
    var g = function (o, k) { return o && o.p ? o.p[k] : null; };
    var T = (b && x) ? { a: (w.a.rev || 0) + b.a.rev + x.a.rev, p: ((w.p ? w.p.rev : 0) + (b.p ? b.p.rev : 0) + (x.p ? x.p.rev : 0)) || null } : null;
    return {
      W: { rev: [w.a.rev, g(w, 'rev')], cnt: [w.a.cnt, g(w, 'cnt')], per: [w.a.per, g(w, 'per')], gst: [w.a.gst, g(w, 'gst')], pp: [w.a.pp, g(w, 'pp')], ut: [w.a.ut, g(w, 'ut')], gsum: [w.a.gsum, g(w, 'gsum')] },
      B: b ? { rev: [b.a.rev, g(b, 'rev')], cnt: [b.a.cnt, g(b, 'cnt')], gst: [b.a.gst, g(b, 'gst')], per: [b.a.per, g(b, 'per')], pg: [b.a.pg, g(b, 'pg')] } : null,
      X: x ? { rev: [x.a.rev, g(x, 'rev')], cnt: [x.a.cnt, g(x, 'cnt')], gst: [x.a.gst, g(x, 'gst')], per: [x.a.per, g(x, 'per')], pg: [x.a.pg, g(x, 'pg')] } : null,
      T: T ? [T.a, T.p] : null
    };
  };

  // ---------- views ----------
  var V = {};
  var needBk = function (el) { if (SNAP.bk) return false; el.innerHTML = '<p class="note">이 화면의 데이터는 다음 갱신(매일 01:00) 후 표시됩니다.</p>'; return true; };

  V.summary = function (el) {
    var m = state.month, h = state.hall, yr = isYear(m), y = yr ? cutY : m.slice(0, 4), S = stream(m), Y = stream('YTD-' + y), F = stream('FY-' + y);
    var tile = function (lbl, cur, ytd, fy) {
      if (!cur) return '';
      var last = yr ? '연간 계획 ' + fmt.mil(fy ? fy[1] : null) + (fy && fy[1] ? ' · 달성 ' + fmt.rate(cur[0] / fy[1]) : '')
        : '누계 ' + fmt.mil(ytd[0]) + ' / 계획 ' + fmt.mil(ytd[1]) + ' · <span class="' + cls(vs(ytd[0], ytd[1])) + '">' + fmt.pct(vs(ytd[0], ytd[1])) + '</span>';
      return '<div class="kpi"><div class="lbl">' + lbl + '</div><div class="val num">' + fmt.mil(cur[0]) + '<small>백만원</small></div>' +
        '<div class="vs num">' + (yr ? '누계 계획 ' : '계획 ') + fmt.mil(cur[1]) + ' · <span class="' + cls(vs(cur[0], cur[1])) + '">' + fmt.pct(vs(cur[0], cur[1])) + '</span></div><div class="ytd num">' + last + '</div></div>';
    };
    var k = '<section>' + secHead('사업별 매출', scopeText(m) + ' · 아래 줄은 ' + (yr ? y + '년 연간 계획 대비' : y + '년 누계')) + '<div class="kpis">' +
      tile('총 매출', S.T, Y.T, F.T) + tile('예식', S.W.rev, Y.W.rev, F.W.rev) + (S.B ? tile('뷔페', S.B.rev, Y.B.rev, F.B ? F.B.rev : null) : '') + (S.X ? tile('B2B', S.X.rev, Y.X.rev, F.X ? F.X.rev : null) : '') + '</div></section>';
    el.innerHTML = k + '<section>' + secHead('본사 보고 양식', '템플릿 베트남 블록과 같은 행·열 · 단위 건, 명, 백만원(객단가 원) · 홀 필터와 무관') + '<div id="tpl"></div></section>';
    document.getElementById('tpl').innerHTML = templateTable(m);
  };

  function templateTable(m) {
    var yr = isYear(m), y = yr ? cutY : m.slice(0, 4), L = mLabel(m), NC = yr ? 7 : 9;
    var head = yr
      ? '<thead><tr><th>구분</th><th>' + L + '</th><th>vs. Budget</th><th>YoY</th><th class="ref">누계 계획</th><th class="ref">연간 계획</th><th>연간 달성률</th></tr></thead>'
      : '<thead><tr><th>구분</th><th>' + L + ' 누계</th><th>vs. Budget</th><th>YoY</th><th>YTD 합계</th><th>vs. Budget</th><th>YoY</th><th class="ref">' + L + ' 계획</th><th class="ref">YTD 계획</th></tr></thead>';
    var cell2 = function (c, t, f, kls, label, fy) {
      if (yr) { var done = fy && fy[1] ? c[0] / fy[1] : null;

        line('계획 매출(백만)', function (o) { return '<td class="num ref">' + (o.planrev ? fmt.mil(o.planrev) : '-') + '</td>'; }) : '');
    el.innerHTML = slotSec + '<section>' + secHead('예식월별 확보 현황', y + '년 예식 · ' + hallName(h) + ' · 확보 = 취소가 아닌 계약(예식 전 포함)' + (y > +cutY ? ' · 금액은 VAT 10%, 임시 환율 5.47원(1월 확정치로 보정)' : '')) + table(hd2, bd2) + '</section>';
  };

  V.slots = function (el) {
    var m = state.slotmonth, rows = (SNAP.board || {})[m] || [], cols = [['LABELLE', '1T'], ['LABELLE', '2T'], ['LABELLE', '3T'], ['LECLAIR', '1T'], ['LECLAIR', '2T'], ['LECLAIR', '3T']];
    var by = {}, days = [];
    rows.forEach(function (r) { by[r[0] + '|' + r[1] + '|' + r[2]] = r; if (days.indexOf(r[0]) < 0) days.push(r[0]); });
    days.sort();
    var wd = function (d) { return '일월화수목금토'[new Date(d + 'T00:00:00').getDay()]; };
    var html = '<div class="hd first">일자</div><div class="hd hall">La Belle</div><div class="hd hall">Le Clair</div><div class="hd first"></div>' +
      cols.map(function (c, i) { return '<div class="hd' + (i === 0 || i === 3 ? ' cell l' : '') + '">' + c[1] + '</div>'; }).join('');
    var nS = 0, nP = 0, nA = 0, nH = 0, nB = 0;
    days.forEach(function (d) {
      html += '<div class="day num">' + +d.slice(5, 7) + '/' + +d.slice(8) + '<small>' + wd(d) + '</small></div>';
      cols.forEach(function (c, i) {
        var r = by[d + '|' + c[0] + '|' + c[1]], show = state.hall === 'ALL' || state.hall === c[0], k = 'slot na';
        if (r && show) {
          if (r[3]) nS++; if (r[4]) nP++; if (r[5] === 1) { nA++; if (r[4]) nH++; } if (r[5] === 2) nB++;
          k = r[5] === 1 ? 'slot actual' + (r[4] ? '' : ' unplanned') : r[5] === 2 ? 'slot booked' : (r[3] ? 'slot' + (r[4] ? ' planned' : '') : 'slot na');
        }
        html += '<div class="cell' + (i === 0 || i === 3 ? ' l' : '') + '"><span class="' + k + '"></span></div>';
      });
    });
    el.innerHTML = '<section>' + secHead(+m.slice(5) + '월 슬롯 예약현황', hallName(state.hall) + ' · 운영 슬롯 ' + nS + ' · 계획 예식 ' + nP + ' · 실제 예식 ' + nA + ' (계획 슬롯 적중 ' + nH + ') · 계약 확보(예식 전) ' + nB) +
      '<div class="board-legend"><span><i class="slot"></i>운영 슬롯 · 계획 없음</span><span><i class="slot planned"></i>계획 예식</span><span><i class="slot actual"></i>실제 예식</span><span><i class="slot actual unplanned"></i>계획 없던 슬롯의 예식</span><span><i class="slot booked"></i>계약 확보(예식 전)</span></div>' +
      '<div class="board-wrap"><div class="board">' + (days.length ? html : '<div class="empty" style="grid-column:1/-1">이 달에는 운영 슬롯이 없습니다.</div>') + '</div></div></section>';
  };

  V.guests = function (el) {
    var m = state.month, h = state.hall, yr = isYear(m), y = yr ? cutY : m.slice(0, 4), c = A(m, h);
    var g = function (k) { return [c.a[k], c.p ? c.p[k] : null]; };
    var tile = function (lbl, v, unit, f) {
      var d = vs(v[0], v[1]);
      return '<div class="kpi"><div class="lbl">' + lbl + '</div><div class="val num">' + f(v[0]) + '<small>' + unit + '</small></div><div class="vs num">계획 ' + f(v[1]) + ' · <span class="' + cls(d) + '">' + fmt.pct(d) + '</span></div></div>';
    };
    var k = '<div class="kpis">' + tile('예식건수', g('cnt'), '건', fmt.int) + tile('건당 매출', g('per'), '백만원', fmt.mil) + tile('총 하객수', g('gsum'), '명', fmt.int) + tile('건당 하객수', g('gst'), '명', fmt.int) + '</div>' +
      '<div class="kpis">' + tile('식음매출', g('fbsum'), '백만원', fmt.mil) + tile('식음객단가', g('pp'), '원', fmt.won) + tile('부대매출', g('ancsum'), '백만원', fmt.mil) + tile('건당 부대매출', g('anc'), '백만원', fmt.mil) + '</div>';
    var get = function (key) { return function (per) { var x = A(per, h); return [x.a[key], x.p ? x.p[key] : null]; }; };
    var t = monthTable([{ label: '건당 하객수(명)', get: get('gst'), f: fmt.int }, { label: '식음객단가(원)', get: get('pp'), f: fmt.won }, { label: '건당 식음매출(백만)', get: get('fb'), f: fmt.mil },
      { label: '건당 부대매출(백만)', get: get('anc'), f: fmt.mil }, { label: '건당 매출(백만)', get: get('per'), f: fmt.mil }], YEAR);
    el.innerHTML = '<section>' + secHead('예식 객수·객단가', scopeText(m) + ' · ' + hallName(h) + ' · 부대 = 부대비용 + 애드온(상품)') + k + '</section>' +
      '<section>' + secHead('예식월별 현황', hallName(h) + ' · 합계 = ' + cutY + '년 누계 · 계획비 = 실적 − 계획') + t + '</section>';
  };

  function render() {
    var v = VIEWS.filter(function (x) { return x[0] === state.view; })[0] || VIEWS[0];
    Array.prototype.forEach.call(nav.querySelectorAll('button'), function (b) { b.setAttribute('aria-current', b.id === 'nav-' + v[0] ? 'page' : 'false'); });
    document.getElementById('title').textContent = v[1];
    document.title = 'The Chapel Vietnam · ' + v[1];
    controls(v[2]);
    V[v[0]](document.getElementById('view'));
  }
  window.addEventListener('hashchange', function () { var k = (location.hash || '').replace('#', ''); if (VIEWS.some(function (v) { return v[0] === k; })) { state.view = k; render(); } });
  render();
}
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbxar4AniJo0tM44LzhhTI4u0OB1KGHC7oP9Ytl7YJKRZmtRdXOGFkD7YykjtHtYvg_b/exec';
  var q = location.search.match(/[?&]key=([^&#]*)/);
  var key = decodeURIComponent((q && q[1]) || location.hash.replace(/^#/, '')).replace(/[^A-Za-z0-9]/g, '').slice(0, 64);
  var app = document.getElementById('app');
  if (!key) { boot(null); return; }
  app.innerHTML = '<div class="empty"><h1>The Chapel Vietnam</h1><p>불러오는 중…</p></div>';
  fetch(API + '?format=json&key=' + encodeURIComponent(key), { credentials: 'omit', cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { boot(d && d.ok ? d.snapshot : null); })
    .catch(function () { app.innerHTML = '<div class="empty"><h1>The Chapel Vietnam</h1><p>데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p></div>'; });
})();
</script>
</body>
</html>
